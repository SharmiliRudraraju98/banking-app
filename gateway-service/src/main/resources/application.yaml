server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: fundtransfer
          uri: lb://banking-fundtransfer
          predicates:
            - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: bankingappsecretkey1234567890123456789012345
  expiration: 3600000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG